name: Deploy Sweet Box Run Web Game
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**','app/src/main/assets/player-face.jpg','app/src/main/assets/app-logo.webp','.github/workflows/deploy-pages.yml']
permissions:
  contents: write
concurrency:
  group: sweet-box-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare assets
        run: |
          mkdir -p web/public
          cp app/src/main/assets/player-face.jpg web/public/player-face.jpg
          cp app/src/main/assets/app-logo.webp web/public/app-logo.webp
      - name: Build web game
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Publish Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist
          publish_branch: gh-pages