name: Build Sweet Box Run 3D APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**','web/**','*.gradle','settings.gradle','gradle.properties','.github/workflows/build-apk.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare assets
        run: |
          mkdir -p web/public
          cp app/src/main/assets/player-face.jpg web/public/player-face.jpg
          cp app/src/main/assets/app-logo.webp web/public/app-logo.webp
      - name: Bundle React game for Android WebView
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npx esbuild src/main.jsx --bundle --minify --format=iife --jsx=automatic --define:import.meta.env.BASE_URL='"./"' --outfile=../app/src/main/assets/game.bundle.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Sweet-Box-Run-3D-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14